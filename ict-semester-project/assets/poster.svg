<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="posterTitle posterDesc">
  <title id="posterTitle">EcoGlow Furnishings Promotional Poster</title>
  <desc id="posterDesc">Minimal promotional poster for the ICT project brief.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f1a" />
      <stop offset="100%" stop-color="#1f5c4c" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="30" />
  <text x="50" y="90" font-family="'Trebuchet MS', sans-serif" font-size="54" fill="#f7f4e9">EcoGlow</text>
  <text x="50" y="140" font-family="'Trebuchet MS', sans-serif" font-size="32" fill="#a8e6cf">Sustainable Furnishings</text>
  <text x="50" y="210" font-family="'Trebuchet MS', sans-serif" font-size="26" fill="#f7f4e9">• Handcrafted Pieces</text>
  <text x="50" y="250" font-family="'Trebuchet MS', sans-serif" font-size="26" fill="#f7f4e9">• Smart Home Lighting</text>
  <text x="50" y="290" font-family="'Trebuchet MS', sans-serif" font-size="26" fill="#f7f4e9">• Green Delivery</text>
  <text x="50" y="350" font-family="'Trebuchet MS', sans-serif" font-size="24" fill="#a8e6cf">Pre-orders open Nov 30</text>
</svg>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Feedback | TRENDCART</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
      <header>
          <div class="wrapper">
              <div class="brand-line">
                  <img src="assets/logo.svg" alt="TRENDCART logo" />
                  <div>
                      <strong>TRENDCART</strong><br />
                  </div>
                  <nav>
                      <ul>
                          <li><a href="index.html">Home</a></li>
                          <li><a href="about.html">About</a></li>
                          <li><a href="products.html">Products</a></li>
                          <li><a href="services.html">Services</a></li>
                          <li><a href="blogs.html">Blogs & Social</a></li>
                          <li><a href="contact.html">Contact</a></li>
                          <li><a class="active" href="feedback.html" target="_blank">Feedback</a></li>
                      </ul>
                  </nav>
              </div>

          </div>
      </header>

    <main>
      <div class="wrapper">
        <section>
          <h1>Customer Feedback Form</h1>
          <p>Give us your valuable feedback.</p>
        </section>

        <section>
          <form action="feedback-success.html" >
            <fieldset>
              <legend>Personal Details</legend>
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />

              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </fieldset>

            <fieldset>
              <legend>Experience</legend>
              <p>Rate Our Service</p>
              <label>
                <input type="radio" name="rating" value="excellent" required />
                Excellent
              </label>
              <label>
                <input type="radio" name="rating" value="good" /> Good
              </label>
              <label>
                <input type="radio" name="rating" value="average" /> Average
              </label>
              <label>
                <input type="radio" name="rating" value="poor" /> Poor
              </label>

              <p>Services Used</p>
              <label>
                <input type="checkbox" name="services[]" value="product" />
                Product Purchase
              </label>
              <label>
                <input type="checkbox" name="services[]" value="delivery" />
                Delivery
              </label>
              <label>
                <input type="checkbox" name="services[]" value="support" />
                Support
              </label>
              <label>
                <input type="checkbox" name="services[]" value="other" />
                Other
              </label>

              <label for="feedback-type">Feedback Type</label>
              <select id="feedback-type" name="feedbackType" required>
                <option value="">Choose one</option>
                <option value="suggestion">Suggestion</option>
                <option value="complaint">Complaint</option>
                <option value="appreciation">Appreciation</option>
              </select>
            </fieldset>

            <fieldset>
              <legend>Comments</legend>
              <label for="comments">Comments</label>
              <textarea id="comments" name="comments" rows="4"></textarea>
            </fieldset>

            <div class="form-actions">
              <input type="submit" value="Submit" />
              <input type="reset" value="Reset" />
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer>
        <div class="wrapper">
            <small>© 2025 · TrendCart.</small>
        </div>
    </footer>
  </body>
</html>
